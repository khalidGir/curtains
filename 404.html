<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#27251f">
  <title>Page Not Found — Habiba Curtains</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Italiana&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #27251f;
      color: #fffdf8;
      font-family: "DM Sans", sans-serif;
      text-align: center;
      padding: 40px 20px;
    }
    .logo {
      font: 400 28px "Italiana", serif;
      letter-spacing: .12em;
      margin-bottom: 60px;
      color: #fffdf8;
      text-decoration: none;
    }
    .logo span { display: block; font: 400 9px "DM Sans", sans-serif; letter-spacing: .36em; margin-top: -2px; }
    .error-code {
      font: 400 clamp(100px, 20vw, 200px)/1 "Italiana", serif;
      letter-spacing: -.06em;
      color: rgba(255, 253, 248, .08);
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 0;
      pointer-events: none;
      user-select: none;
    }
    .content { position: relative; z-index: 1; }
    h1 {
      font: 400 clamp(32px, 5vw, 56px)/1.1 "Italiana", serif;
      letter-spacing: -.03em;
      margin-bottom: 20px;
    }
    h1 em { font-style: italic; font-weight: 400; }
    p {
      font-size: 15px;
      color: rgba(255, 253, 248, .6);
      max-width: 400px;
      line-height: 1.7;
      margin-bottom: 40px;
    }
    .actions { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 28px;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .14em;
      text-decoration: none;
      border-radius: 100px;
      transition: all .25s cubic-bezier(.4, 0, .2, 1);
    }
    .btn-primary { background: #fffdf8; color: #27251f; }
    .btn-primary:hover { background: #f4efe4; transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,.3); }
    .btn-ghost { border: 1px solid rgba(255,253,248,.3); color: #fffdf8; }
    .btn-ghost:hover { border-color: #fffdf8; background: rgba(255,253,248,.06); }
    .links { margin-top: 60px; display: flex; gap: 32px; }
    .links a {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: rgba(255,253,248,.4);
      text-decoration: none;
      transition: color .2s;
    }
    .links a:hover { color: #fffdf8; }
    @media (max-width: 480px) {
      .actions { flex-direction: column; width: 100%; }
      .btn { width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>
  <a class="logo" href="/">HABIBA<span>CURTAINS</span></a>

  <div class="error-code">404</div>

  <div class="content">
    <h1>This page has<br><em>slipped away.</em></h1>
    <p>The curtain may have fallen on this link. Let us guide you back to the collection.</p>
    <div class="actions">
      <a class="btn btn-primary" href="/">Back to home</a>
      <a class="btn btn-ghost" href="/catalog.html">Explore fabrics</a>
    </div>
  </div>

  <nav class="links">
    <a href="/catalog.html">Fabrics</a>
    <a href="/projects.html">Projects</a>
    <a href="tel:+251903146834">Call us</a>
  </nav>
</body>
</html>
